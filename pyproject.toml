[project]
name = "customer-segmentation"
version = "2.0.0"
description = "Customer Segmentation and Retail Intelligence using K-Means Clustering on the UCI Online Retail dataset"
authors = [{ name = "Karthik Neduri" }]
requires-python = ">=3.11"

[tool.black]
line-length = 95
target-version = ["py311", "py312"]

[tool.ruff]
line-length = 95
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
